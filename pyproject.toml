[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-crew"
version = "0.1.0"
description = "CrewAI application that reads academic papers and drafts a cited literature review on Gemini / Vertex AI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai]>=1.15",
    "google-genai>=1.65",
    "google-cloud-aiplatform>=1.145",
    "google-cloud-storage>=3.0",
    "google-cloud-firestore>=2.20",
    "google-cloud-tasks>=2.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
frontend = ["streamlit>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["research_crew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*cannot be saved in a checkpoint:UserWarning",
]
